<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sul PC — Formatação & Limpeza De PCs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0e0e0e;
    --white: #f5f3ee;
    --cream: #ede9e1;
    --red: #c0392b;
    --red-dark: #922b21;
    --gray: #7a7a72;
    --border: #d4cfc6;
  }

  html.dark {
    --black: #f0ede8;
    --white: #141414;
    --cream: #1e1e1e;
    --red: #e05c4b;
    --gray: #888880;
    --border: #2a2a2a;
  }

  html { scroll-behavior: smooth; }
  *, *::before, *::after { transition: background-color 0.25s, border-color 0.25s, color 0.15s; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--white);
    color: var(--black);
    font-size: 16px;
    line-height: 1.6;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2.5rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    color: var(--black);
    text-decoration: none;
  }

  .nav-logo span { color: var(--red); }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-size: 0.875rem;
    font-weight: 400;
    color: var(--gray);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--black); }

  .nav-cta {
    background: var(--black);
    color: var(--white) !important;
    padding: 0.5rem 1.2rem;
    border-radius: 2px;
    font-size: 0.85rem !important;
    font-weight: 500 !important;
    transition: background 0.2s !important;
  }
  .nav-cta:hover { background: var(--red) !important; color: var(--white) !important; }

  .theme-toggle {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--black);
    flex-shrink: 0;
  }

  #hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding-top: 64px;
  }

  .hero-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5rem 3rem 5rem 2.5rem;
    border-right: 1px solid var(--border);
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(3rem, 5vw, 4.5rem);
    font-weight: 800;
    line-height: 1.0;
    margin-bottom: 1.5rem;
  }

  h1 em { color: var(--red); font-style: normal; }

  .hero-desc {
    font-size: 1.05rem;
    color: var(--gray);
    margin-bottom: 2.5rem;
  }

  .btn-primary {
    background: var(--black);
    color: var(--white);
    padding: 0.85rem 2rem;
    text-decoration: none;
  }

  #agendamento {
    padding: 6rem 2.5rem;
  }

  input, select, textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
  }

  .btn-submit {
    width: 100%;
    padding: 10px;
    background: var(--black);
    color: white;
    border: none;
    cursor: pointer;
  }

  .form-success {
    display: none;
    text-align: center;
  }
</style>
</head>
<body>

<section id="agendamento">
  <h2>Agende seu serviço</h2>

  <div id="form-content">
    <input type="text" id="nome" placeholder="Nome">
    <input type="tel" id="tel" placeholder="Telefone">

    <select id="servico">
      <option value="">Selecione</option>
      <option>Formatação completa</option>
      <option>Limpeza</option>
    </select>

    <input type="date" id="data">

    <select id="periodo">
      <option value="">Período</option>
      <option>Manhã</option>
      <option>Tarde</option>
    </select>

    <textarea id="problema" placeholder="Descreva"></textarea>

    <button class="btn-submit" onclick="enviarForm()">Enviar</button>
  </div>

  <div id="form-success" class="form-success">
    <h3>Enviado!</h3>
    <p>Te chamaremos no WhatsApp.</p>
  </div>
</section>

<script>
function enviarForm() {
  const nome = document.getElementById('nome').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const servico = document.getElementById('servico').value;
  const data = document.getElementById('data').value;
  const periodo = document.getElementById('periodo').value;
  const problema = document.getElementById('problema').value.trim();

  if (!nome || !tel || !servico || !data) {
    alert('Preencha os campos obrigatórios');
    return;
  }

  const dataFormatada = new Date(data + 'T12:00:00').toLocaleDateString('pt-BR');

  const msg = encodeURIComponent(
    'Olá! Gostaria de agendar um serviço.\n\n' +
    'Nome: ' + nome + '\n' +
    'Telefone: ' + tel + '\n' +
    'Serviço: ' + servico + '\n' +
    'Data: ' + dataFormatada + (periodo ? ' - ' + periodo : '') + '\n' +
    'Problema: ' + (problema || 'Não informado')
  );

  window.open('https://wa.me/5551986586196?text=' + msg, '_blank');

  document.getElementById('form-content').style.display = 'none';
  document.getElementById('form-success').style.display = 'block';
}
</script>

</body>
</html>
